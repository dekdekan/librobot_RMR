name: Release

"on":
  push:
    tags:
      - v1.1.0-rc.1
      - v1.1.0

permissions:
  contents: read

jobs:
  build:
    name: Package ${{ matrix.os }}
    if: github.repository == 'dekdekan/librobot_RMR'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: ["windows", "ubuntu", "macos"]
        include:
          - os: windows
            runner: windows-2022
          - os: ubuntu
            runner: ubuntu-24.04
          - os: macos
            runner: macos-15
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Python for the Qt installer
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.3"

      - name: Install Qt 6.8.3 for MSVC 2022 x64
        if: matrix.os == 'windows'
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1 internal action
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: "false"
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.0"

      - name: Install Qt 6.8.3
        if: matrix.os != 'windows'
        uses: jurplel/install-qt-action/action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1 internal action
        with:
          version: "6.8.3"
          cache: "false"
          aqtversion: "==3.3.0"
          py7zrversion: "==1.1.0"

      - name: Validate Windows x64 and install release tools
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') {
            throw "Expected AMD64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          choco install nsis --version=3.12.0 --yes --no-progress
          $asset = Join-Path $PWD 'opencv-4.14.0-windows.exe'
          Invoke-WebRequest -Uri 'https://github.com/opencv/opencv/releases/download/4.14.0/opencv-4.14.0-windows.exe' -OutFile $asset
          $actual = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '5f266a8b73bed535962d7e861a6457e32a0dd5f463ad0a7cf8707a135469be63') {
            throw "OpenCV 4.14.0 SHA256 mismatch"
          }
          $extractRoot = Join-Path $PWD 'opencv-dist'
          $extractor = Start-Process -FilePath $asset `
            -ArgumentList @('-y', '-d', $extractRoot) -Wait -PassThru
          if ($extractor.ExitCode -ne 0) {
            throw "OpenCV extraction failed: $($extractor.ExitCode)"
          }
          $opencvConfig = Get-ChildItem -LiteralPath $PWD -Filter OpenCVConfig.cmake `
            -Recurse -File | Where-Object {
              $_.FullName -match '[\\/]opencv[\\/]build[\\/]x64[\\/][^\\/]+[\\/]lib[\\/]OpenCVConfig\.cmake$'
            } | Select-Object -First 1
          if (-not $opencvConfig) {
            throw "Official OpenCV MSVC x64 package layout changed"
          }
          $opencvDir = $opencvConfig.DirectoryName
          "OpenCV_DIR=$opencvDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Ubuntu x64 and install release tools
        if: matrix.os == 'ubuntu'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          sudo apt-get update
          sudo apt-get install --yes libopencv-dev ninja-build dpkg-dev
          pkg-config --modversion opencv4

      - name: Validate macOS arm64 and install release tools
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install opencv@4 ninja
          opencv_config="$(find "$(brew --prefix opencv@4)" -type f -name OpenCVConfig.cmake -print -quit)"
          test -n "$opencv_config"
          opencv_dir="$(dirname "$opencv_config")"
          echo "OpenCV_DIR=$opencv_dir" >> "$GITHUB_ENV"

      - name: Check out pinned private AMCL after dependency setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dekdekan/amcl
          ref: v1.0.0
          path: private-amcl
          ssh-key: ${{ secrets.AMCL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Verify immutable AMCL revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-amcl rev-parse HEAD)" = dc39c300ec2bb60cae13603a5cae460e325f6c26

      - name: Prepare package manifest install rule on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType File -Path build-manifest.txt -Force | Out-Null
          'install(FILES "${LIBROBOT_BUILD_MANIFEST}" DESTINATION "share/librobot")' |
            Set-Content -LiteralPath package-manifest.cmake -Encoding utf8

      - name: Prepare package manifest install rule on Unix
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          : > build-manifest.txt
          printf '%s\n' 'install(FILES "${LIBROBOT_BUILD_MANIFEST}" DESTINATION "share/librobot")' > package-manifest.cmake

      - name: Configure Windows release tree
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DBUILD_TESTING=ON -DLIBROBOT_ENABLE_AMCL=ON `
            -DLIBROBOT_ENABLE_OPENCV=ON `
            -DFETCHCONTENT_SOURCE_DIR_AMCL="${{ github.workspace }}/private-amcl" `
            -DOpenCV_DIR="$env:OpenCV_DIR" `
            -DLIBROBOT_BUILD_MANIFEST="${{ github.workspace }}/build-manifest.txt" `
            -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${{ github.workspace }}/package-manifest.cmake"

      - name: Configure Unix Debug tree
        if: matrix.os != 'windows'
        shell: bash
        run: >
          cmake -S . -B build-debug -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DLIBROBOT_ENABLE_AMCL=ON
          -DLIBROBOT_ENABLE_OPENCV=ON
          -DFETCHCONTENT_SOURCE_DIR_AMCL="${{ github.workspace }}/private-amcl"
          -DLIBROBOT_BUILD_MANIFEST="${{ github.workspace }}/build-manifest.txt"
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${{ github.workspace }}/package-manifest.cmake"

      - name: Configure Unix Release tree
        if: matrix.os != 'windows'
        shell: bash
        run: >
          cmake -S . -B build-release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON -DLIBROBOT_ENABLE_AMCL=ON
          -DLIBROBOT_ENABLE_OPENCV=ON
          -DFETCHCONTENT_SOURCE_DIR_AMCL="${{ github.workspace }}/private-amcl"
          -DLIBROBOT_BUILD_MANIFEST="${{ github.workspace }}/build-manifest.txt"
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="${{ github.workspace }}/package-manifest.cmake"

      - name: Record exact Windows build manifest
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $compilerFile = Get-ChildItem -LiteralPath build/CMakeFiles -Filter CMakeCXXCompiler.cmake -Recurse |
            Select-Object -First 1
          if (-not $compilerFile) { throw 'CMake compiler metadata is missing' }
          $compilerText = Get-Content -LiteralPath $compilerFile.FullName -Raw
          $compilerId = [regex]::Match($compilerText, 'CMAKE_CXX_COMPILER_ID "([^"]+)"').Groups[1].Value
          $compilerVersion = [regex]::Match($compilerText, 'CMAKE_CXX_COMPILER_VERSION "([^"]+)"').Groups[1].Value
          $qtTool = Get-Command qmake, qmake6 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $qtTool) { throw 'Qt version tool is missing' }
          $qtVersion = (& $qtTool.Source -query QT_VERSION).Trim()
          @(
            'OS=Windows Server 2022'
            'Architecture=x86_64 (AMD64)'
            "Compiler=$compilerId $compilerVersion (Visual Studio 2022)"
            "Qt=$qtVersion"
            'OpenCV=4.14.0'
          ) | Set-Content -LiteralPath build-manifest.txt -Encoding utf8

      - name: Record exact Ubuntu build manifest
        if: matrix.os == 'ubuntu'
        shell: bash
        run: |
          set -euo pipefail
          qt_tool=$(command -v qmake6 || command -v qmake)
          {
            echo 'OS=Ubuntu 24.04'
            echo 'Architecture=x86_64'
            echo "Compiler=GCC $(c++ -dumpfullversion -dumpversion)"
            echo "Qt=$($qt_tool -query QT_VERSION)"
            echo "OpenCV=$(pkg-config --modversion opencv4)"
          } > build-manifest.txt

      - name: Record exact macOS build manifest
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          qt_tool=$(command -v qmake6 || command -v qmake)
          {
            echo 'OS=macOS 15'
            echo 'Architecture=arm64'
            echo "Compiler=AppleClang $(xcrun clang++ --version | head -n 1)"
            echo "Qt=$($qt_tool -query QT_VERSION)"
            echo "OpenCV=$(brew list --versions opencv@4 | awk '{print $2}')"
          } > build-manifest.txt

      - name: Build Windows Debug and Release
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build --config Debug --parallel 2
          cmake --build build --config Release --parallel 2

      - name: Test Windows Debug and Release without hardware
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ctest --test-dir build -C Debug --output-on-failure
          ctest --test-dir build -C Release --output-on-failure
          ctest --test-dir build -C Release -R '^package\.layout\.' --output-on-failure

      - name: Build and test Unix Debug and Release without hardware
        if: matrix.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build-debug --config Debug --parallel 2
          ctest --test-dir build-debug -C Debug --output-on-failure
          cmake --build build-release --config Release --parallel 2
          ctest --test-dir build-release -C Release --output-on-failure
          ctest --test-dir build-release -C Release -R '^package\.layout\.' --output-on-failure

      - name: Generate and validate Windows NSIS and ZIP packages
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          function Test-LibrobotConsumer {
            param(
              [Parameter(Mandatory)] [string] $Prefix,
              [Parameter(Mandatory)] [string] $BuildDirectory
            )
            cmake -S tests/consumer -B $BuildDirectory -G "Visual Studio 17 2022" -A x64 `
              -Dlibrobot_DIR="$Prefix/lib/cmake/librobot" `
              -DQt6_DIR="$env:QT_ROOT_DIR/lib/cmake/Qt6" `
              -DOpenCV_DIR="$env:OpenCV_DIR" `
              -DLIBROBOT_CONSUMER_EXPECT_AMCL=ON `
              -DLIBROBOT_CONSUMER_EXPECT_OPENCV=ON
            cmake --build $BuildDirectory --config Release --parallel 2
            $consumer = Join-Path $BuildDirectory 'Release/librobot_consumer.exe'
            if (-not (Test-Path -LiteralPath $consumer -PathType Leaf)) {
              throw "Installed-package consumer is missing: $consumer"
            }
            $savedProcessPath = $env:PATH
            $opencvRuntime = Join-Path (Split-Path $env:OpenCV_DIR -Parent) 'bin'
            try {
              $env:PATH = "$(Join-Path $Prefix 'bin');$(Join-Path $env:QT_ROOT_DIR 'bin');$opencvRuntime;$savedProcessPath"
              & $consumer
            } finally {
              $env:PATH = $savedProcessPath
            }
          }

          cpack --config build/CPackConfig.cmake -C Release -G NSIS
          cpack --config build/CPackConfig.cmake -C Release -G ZIP
          $packageDir = Join-Path $PWD 'build/packages'
          $installer = Join-Path $packageDir 'librobot-1.1.0-win64.exe'
          $archive = Join-Path $packageDir 'librobot-1.1.0-win64.zip'
          if (-not (Test-Path -LiteralPath $installer) -or -not (Test-Path -LiteralPath $archive)) {
            throw 'CPack did not produce the exact Windows NSIS and ZIP artifacts'
          }
          $stage = Join-Path $PWD 'portable-install'
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          foreach ($entry in @('bin/librobot.dll', 'bin/librobot_d.dll', 'lib/librobot.lib',
              'lib/librobot_d.lib', 'include/librobot/librobot.h',
              'lib/cmake/librobot/librobotConfig.cmake', 'share/librobot/build-manifest.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $stage $entry))) {
              throw "Windows ZIP is missing $entry"
            }
          }
          if ((Compare-Object (Get-Content build-manifest.txt) (Get-Content (Join-Path $stage 'share/librobot/build-manifest.txt')))) {
            throw 'Windows ZIP build manifest differs from the generated manifest'
          }
          $dll = Join-Path $stage 'bin/librobot.dll'
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'Windows package runtime is not x64'
          }
          $forbidden = Get-ChildItem -LiteralPath $stage -Recurse -File | Where-Object {
            $_.FullName -match 'private-amcl|[\\/](lib)?amcl[^\\/]*\.(dll|lib|a)$|[\\/](opencv|Qt6)[^\\/]*\.dll$'
          }
          if ($forbidden) { throw 'Windows ZIP contains a private AMCL or bundled dependency file' }

          $originalUserRoot = [Environment]::GetEnvironmentVariable('LIBROBOT_ROOT', [EnvironmentVariableTarget]::User)
          $originalUserPath = [Environment]::GetEnvironmentVariable('Path', [EnvironmentVariableTarget]::User)
          if ($null -ne $originalUserRoot) { throw 'Disposable runner already has a user LIBROBOT_ROOT' }
          $portableBin = Join-Path $stage 'bin'
          try {
            [Environment]::SetEnvironmentVariable('LIBROBOT_ROOT', $stage, [EnvironmentVariableTarget]::User)
            $portableUserPath = if ([string]::IsNullOrWhiteSpace($originalUserPath)) {
              $portableBin
            } else {
              "$portableBin;$originalUserPath"
            }
            [Environment]::SetEnvironmentVariable('Path', $portableUserPath, [EnvironmentVariableTarget]::User)
            if ([Environment]::GetEnvironmentVariable('LIBROBOT_ROOT', [EnvironmentVariableTarget]::User) -ne $stage) {
              throw 'Portable ZIP LIBROBOT_ROOT was not installed'
            }
            if ([Environment]::GetEnvironmentVariable('Path', [EnvironmentVariableTarget]::User) -notlike "$portableBin*") {
              throw 'Portable ZIP bin directory was not added to the user PATH'
            }
            Test-LibrobotConsumer -Prefix $stage -BuildDirectory (Join-Path $PWD 'consumer-zip')
          } finally {
            [Environment]::SetEnvironmentVariable('LIBROBOT_ROOT', $null, [EnvironmentVariableTarget]::User)
            [Environment]::SetEnvironmentVariable('Path', $originalUserPath, [EnvironmentVariableTarget]::User)
          }
          Remove-Item -LiteralPath $stage -Recurse -Force
          if (Test-Path -LiteralPath $stage) { throw 'Portable ZIP uninstall left installed files' }
          if ($null -ne [Environment]::GetEnvironmentVariable('LIBROBOT_ROOT', [EnvironmentVariableTarget]::User)) {
            throw 'Portable ZIP uninstall left LIBROBOT_ROOT set'
          }
          if ([Environment]::GetEnvironmentVariable('Path', [EnvironmentVariableTarget]::User) -ne $originalUserPath) {
            throw 'Portable ZIP uninstall did not restore the user PATH'
          }

          $installProcess = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "NSIS install failed: $($installProcess.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'librobot'
          foreach ($entry in @('bin/librobot.dll', 'bin/librobot_d.dll', 'share/librobot/build-manifest.txt', 'Uninstall.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $installed $entry))) {
              throw "Installed NSIS layout is missing $entry"
            }
          }
          $installedBin = Join-Path $installed 'bin'
          if ([Environment]::GetEnvironmentVariable('LIBROBOT_ROOT', [EnvironmentVariableTarget]::User) -ne $installed) {
            throw 'NSIS did not set the documented user LIBROBOT_ROOT'
          }
          $installedPathEntries = [Environment]::GetEnvironmentVariable('Path', [EnvironmentVariableTarget]::User) -split ';' |
            ForEach-Object { $_.Trim().TrimEnd('\\') }
          if ($installedPathEntries -notcontains $installedBin.TrimEnd('\\')) {
            throw 'NSIS did not add its bin directory to the documented user PATH'
          }
          Test-LibrobotConsumer -Prefix $installed -BuildDirectory (Join-Path $PWD 'consumer-nsis')
          $uninstallProcess = Start-Process -FilePath (Join-Path $installed 'Uninstall.exe') -ArgumentList '/S' -Wait -PassThru
          if ($uninstallProcess.ExitCode -ne 0) { throw "NSIS uninstall failed: $($uninstallProcess.ExitCode)" }
          if (Test-Path -LiteralPath $installed) { throw 'NSIS uninstall left the install directory' }
          if ($null -ne [Environment]::GetEnvironmentVariable('LIBROBOT_ROOT', [EnvironmentVariableTarget]::User)) {
            throw 'NSIS uninstall left LIBROBOT_ROOT set instead of removed'
          }
          $uninstalledPathEntries = [Environment]::GetEnvironmentVariable('Path', [EnvironmentVariableTarget]::User) -split ';' |
            ForEach-Object { $_.Trim().TrimEnd('\\') }
          if ($uninstalledPathEntries -contains $installedBin.TrimEnd('\\')) {
            throw 'NSIS uninstall left its bin directory in the user PATH'
          }
          if (Test-Path -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\librobot') {
            throw 'NSIS uninstall left the Installed apps registry entry'
          }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          Copy-Item -LiteralPath $installer, $archive -Destination release-assets
          foreach ($artifact in Get-ChildItem -LiteralPath release-assets -File) {
            $hash = (Get-FileHash -LiteralPath $artifact.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "$hash  $($artifact.Name)"
            [System.IO.File]::WriteAllText(
              "$($artifact.FullName).sha256",
              "$line`n",
              [System.Text.UTF8Encoding]::new($false)
            )
          }

      - name: Generate and validate Ubuntu DEB and TGZ packages
        if: matrix.os == 'ubuntu'
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build-release/CPackConfig.cmake -C Release -G DEB
          cpack --config build-release/CPackConfig.cmake -C Release -G TGZ
          package_dir=build-release/packages
          deb="$package_dir/librobot-1.1.0-Linux.deb"
          tgz="$package_dir/librobot-1.1.0-Linux.tar.gz"
          test -f "$deb"
          test -f "$tgz"
          mkdir package-stage-deb package-stage-tgz
          dpkg-deb --extract "$deb" package-stage-deb
          tar -xzf "$tgz" -C package-stage-tgz
          for stage in package-stage-deb package-stage-tgz; do
            test -f "$stage/usr/lib/liblibrobot.so.1.1.0"
            test -f "$stage/usr/include/librobot/librobot.h"
            test -f "$stage/usr/lib/cmake/librobot/librobotConfig.cmake"
            test -f "$stage/usr/share/librobot/build-manifest.txt"
            cmp build-manifest.txt "$stage/usr/share/librobot/build-manifest.txt"
            file "$stage/usr/lib/liblibrobot.so.1.1.0" | grep -q 'x86-64'
            cmake \
              -DLIBROBOT_LIBRARY="$stage/usr/lib/liblibrobot.so.1.1.0" \
              -DLIBROBOT_NM="$(command -v nm)" \
              -DLIBROBOT_PLATFORM=Linux \
              -P cmake/VerifyExportedSymbols.cmake
            if find "$stage" -type f \( -iname '*private-amcl*' -o -iname 'libamcl*' -o -iname 'libopencv*.so*' -o -iname 'libQt6*.so*' \) | grep -q .; then
              echo 'Ubuntu package contains private AMCL or a bundled dependency' >&2
              exit 1
            fi
          done

          test_installed_consumer() {
            build_dir=$1
            export LIBROBOT_QT_ROOT="$QT_ROOT_DIR"
            test -f "$LIBROBOT_QT_ROOT/lib/cmake/Qt6/Qt6Config.cmake"
            test "$("$LIBROBOT_QT_ROOT/bin/qmake" -query QT_VERSION)" = 6.8.3
            cmake -S tests/consumer -B "$build_dir" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -Dlibrobot_DIR=/usr/lib/cmake/librobot \
              -DQt6_DIR="$LIBROBOT_QT_ROOT/lib/cmake/Qt6" \
              -DLIBROBOT_CONSUMER_EXPECT_AMCL=ON \
              -DLIBROBOT_CONSUMER_EXPECT_OPENCV=ON
            cmake --build "$build_dir" --parallel 2
            test -x "$build_dir/librobot_consumer"
            LD_LIBRARY_PATH="$LIBROBOT_QT_ROOT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
              "$build_dir/librobot_consumer"
          }

          sudo apt install --yes "$PWD/$deb"
          test -f /usr/lib/liblibrobot.so.1.1.0
          test -f /usr/lib/cmake/librobot/librobotConfig.cmake
          test_installed_consumer consumer-deb
          sudo apt remove --yes librobot
          test ! -e /usr/lib/liblibrobot.so.1.1.0
          test ! -e /usr/include/librobot
          test ! -e /usr/lib/cmake/librobot
          test ! -e /usr/share/librobot

          sudo tar -xzf "$tgz" -C /
          sudo ldconfig
          test -f /usr/lib/liblibrobot.so.1.1.0
          test_installed_consumer consumer-tgz
          sudo rm -f /usr/lib/liblibrobot.so /usr/lib/liblibrobot.so.1 /usr/lib/liblibrobot.so.1.1.0
          sudo rm -rf /usr/include/librobot /usr/lib/cmake/librobot /usr/share/librobot
          sudo ldconfig
          test ! -e /usr/lib/liblibrobot.so.1.1.0
          test ! -e /usr/include/librobot
          test ! -e /usr/lib/cmake/librobot
          test ! -e /usr/share/librobot

          mkdir release-assets
          cp "$deb" "$tgz" release-assets/
          for artifact in release-assets/*; do
            name=$(basename "$artifact")
            (cd release-assets && sha256sum "$name" > "$name.sha256")
          done

      - name: Generate and validate macOS TGZ package
        if: matrix.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          cpack --config build-release/CPackConfig.cmake -C Release -G TGZ
          package=build-release/packages/librobot-1.1.0-Darwin.tar.gz
          test -f "$package"
          mkdir package-stage-tgz
          tar -xzf "$package" -C package-stage-tgz
          test -f package-stage-tgz/lib/liblibrobot.1.1.0.dylib
          test -f package-stage-tgz/include/librobot/librobot.h
          test -f package-stage-tgz/lib/cmake/librobot/librobotConfig.cmake
          test -x package-stage-tgz/install.sh
          test -x package-stage-tgz/uninstall.sh
          test -f package-stage-tgz/share/librobot/build-manifest.txt
          cmp build-manifest.txt package-stage-tgz/share/librobot/build-manifest.txt
          file package-stage-tgz/lib/liblibrobot.1.1.0.dylib | grep -q arm64
          cmake \
            -DLIBROBOT_LIBRARY=package-stage-tgz/lib/liblibrobot.1.1.0.dylib \
            -DLIBROBOT_NM="$(command -v nm)" \
            -DLIBROBOT_PLATFORM=Darwin \
            -P cmake/VerifyExportedSymbols.cmake
          if find package-stage-tgz -type f \( -iname '*private-amcl*' -o -iname 'libamcl*' -o -iname 'libopencv*.dylib' -o -iname 'libQt6*.dylib' \) | grep -q .; then
            echo 'macOS package contains private AMCL or a bundled dependency' >&2
            exit 1
          fi

          (
            cd package-stage-tgz
            sudo ./install.sh
          )
          export LIBROBOT_ROOT=/usr/local
          test "$LIBROBOT_ROOT" = /usr/local
          test -f /usr/local/lib/liblibrobot.1.1.0.dylib
          test -f /usr/local/lib/cmake/librobot/librobotConfig.cmake
          cmake -S tests/consumer -B consumer-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -Dlibrobot_DIR=/usr/local/lib/cmake/librobot \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DOpenCV_DIR="$OpenCV_DIR" \
            -DLIBROBOT_CONSUMER_EXPECT_AMCL=ON \
            -DLIBROBOT_CONSUMER_EXPECT_OPENCV=ON
          cmake --build consumer-macos --parallel 2
          test -x consumer-macos/librobot_consumer
          DYLD_LIBRARY_PATH="/usr/local/lib:$QT_ROOT_DIR/lib:$(brew --prefix opencv@4)/lib:${DYLD_LIBRARY_PATH:-}" \
            consumer-macos/librobot_consumer
          (
            cd package-stage-tgz
            sudo ./uninstall.sh
          )
          unset LIBROBOT_ROOT
          test -z "${LIBROBOT_ROOT+x}"
          test -z "$(find /usr/local/lib -maxdepth 1 -name 'liblibrobot*' -print -quit)"
          test ! -e /usr/local/include/librobot
          test ! -e /usr/local/lib/cmake/librobot

          mkdir release-assets
          cp "$package" release-assets/
          for artifact in release-assets/*; do
            name=$(basename "$artifact")
            (cd release-assets && shasum -a 256 "$name" > "$name.sha256")
          done

      - name: Upload curated release assets only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.os }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish exact tag
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified package sets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify every downloaded package against its SHA-256 sidecar
        shell: bash
        run: |
          set -euo pipefail
          packages=(
            librobot-1.1.0-win64.exe
            librobot-1.1.0-win64.zip
            librobot-1.1.0-Linux.deb
            librobot-1.1.0-Linux.tar.gz
            librobot-1.1.0-Darwin.tar.gz
          )
          for package in "${packages[@]}"; do
            test -f "dist/$package"
            test -f "dist/$package.sha256"
            sidecar_target=$(awk '{ sub(/^\*/, "", $2); print $2 }' "dist/$package.sha256")
            test "$sidecar_target" = "$package"
            (cd dist && sha256sum --check --strict "$package.sha256")
          done
          test "$(find dist -maxdepth 1 -type f -name '*.sha256' | wc -l)" -eq "${#packages[@]}"

      - name: Build release notes from package manifests
        shell: bash
        run: |
          set -euo pipefail
          mkdir manifest-linux
          unzip -p dist/librobot-1.1.0-win64.zip share/librobot/build-manifest.txt > manifest-windows.txt
          dpkg-deb --extract dist/librobot-1.1.0-Linux.deb manifest-linux
          tar -xOf dist/librobot-1.1.0-Darwin.tar.gz share/librobot/build-manifest.txt > manifest-macos.txt
          {
            echo "librobot $GITHUB_REF_NAME"
            echo
            echo 'Qt and OpenCV are prerequisites and are not bundled.'
            echo
            echo '### Windows package'
            sed 's/^/- /' manifest-windows.txt
            echo
            echo '### Ubuntu package'
            sed 's/^/- /' manifest-linux/usr/share/librobot/build-manifest.txt
            echo
            echo '### macOS package'
            sed 's/^/- /' manifest-macos.txt
          } > release-notes.md

      - name: Publish release candidate
        if: github.ref_name == 'v1.1.0-rc.1'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease
          --title "$GITHUB_REF_NAME" --notes-file release-notes.md

      - name: Publish final release
        if: github.ref_name == 'v1.1.0'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --latest
          --title "$GITHUB_REF_NAME" --notes-file release-notes.md
