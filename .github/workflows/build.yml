name: Build Professional Installers

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_VERSION: 6.6.2

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # -----------------------
      # Install Dependencies
      # -----------------------
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ matrix.os == 'windows-latest' && 'win64_msvc2019_64' || (matrix.os == 'macos-latest' && 'clang_64' || 'gcc_64') }}

      - name: Install NSIS (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Build Essentials (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # -----------------------
      # Build and Package
      # -----------------------
      - name: Setup MSVC (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build and Package
        shell: bash
        run: |
          mkdir build && cd build
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            # Windows (Multi-config): Build both, then package once
            cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_INSTALL_PREFIX=./install
            cmake --build . --config Release --parallel
            cmake --build . --config Debug --parallel
            cpack -C "Release;Debug"
          else
            # Linux/macOS (Single-config): Install Release, then Build/Install Debug
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=./install
            cmake --build . --parallel
            cmake --install .
            
            cmake .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_INSTALL_PREFIX=./install
            cmake --build . --parallel
            cmake --install .
            
            cpack
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: robotlib-installers-${{ matrix.os }}
          path: build/RobotLib-*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: robotlib-installers-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: RobotLib ${{ github.ref_name }}
          body: "RMR robotlib installer (Release + Debug). Qt must be installed separately by the user."
          draft: false
          prerelease: false